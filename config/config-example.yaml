server:
  listen: 0.0.0.0:8080
  metrics_listen: 0.0.0.0:3001
  jwt_secret: 12345678
  allow_origins:
    - "http://localhost"
    # - "https://*.hachimi-world-client.pages.dev"  # single-level subdomain wildcard
  publish_version_token: 12345678
db:
  address: postgresql:5432
  username: user
  password: 12345678
  database: db
redis:
  address: redis:6379
  database: 0
email:
  host: email.example.com
  username: noreply@example.com
  password: 12345678
  no_reply_email: noreply@example.com
s3:
  bucket_name: bucket-name
  endpoint_url: https://endpoint.example.com
  public_domain: storage.example.com
  access_key_id: abcdef
  access_key_secret: abcdef
meilisearch:
  host: http://localhost:7700
  api_key: 12345678
turnstile:
  captcha_page_url: "http://localhost:8080/api/auth/captcha"
  api_base_url: "http://localhost:8080/api"
  site_key: "1x00000000000000000000AA"
  secret_key: "1x0000000000000000000000000000000AA"
# Optional. When present, the server regenerates the sitemap daily at 04:00 Beijing time and uploads it to s3 under
# sitemap/<path_secret>/. Submit https://hachimi.world/sitemap/<path_secret>/index.xml in Search Console.
sitemap:
  site_url: https://hachimi.world
  path_secret: change-me-to-a-random-string
  # Bearer token for POST /api/sitemap/generate and GET /api/sitemap/generation/list
  trigger_token: change-me-to-another-random-string
community:
  contributors:
    - "maintainer@example.com"
# Required. Usernames and bios are checked with TypeSafe's Jev when they change, and blocked ones
# aren't saved. Off unless enabled is true; when false, nothing else here is read, so local runs
# don't need a TypeSafe key. At startup the key, the model and the policy are tried against
# TypeSafe; a rejection stops the server. policy_dir holds the policy;
# config/content-check-example/ shows the format.
content_check:
  enabled: false
  policy_dir: config/content-check-example
  # Pin a version; the thresholds are tuned against it.
  model: jev-1.13.0
  typesafe:
    api_key: change-me
    base_url: https://api.typesafe.ai
    timeout_ms: 3000
