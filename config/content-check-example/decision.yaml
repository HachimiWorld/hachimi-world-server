# An example content check policy, enough to run the server. The real policy lives in deployment
# config, outside this repository, so its questions and thresholds aren't public.
#
# questions/<subject>.json is the `questions` map of TypeSafe's System One API, sent as it is.
# Here, each subject gives a threshold for some of its noul questions: content whose probability
# reaches it is blocked. The server checks the subjects user.username and user.bio, and refuses to
# start unless the policy has exactly those, each with a questions file.
subjects:
  user.username:
    block_at: { sexual: 0.8, spam: 0.8 }
  user.bio:
    block_at: { sexual: 0.8, spam: 0.8 }
