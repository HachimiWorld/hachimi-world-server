services:
  meilisearch:
    image: getmeili/meilisearch:v1.56
    ports:
      - '7700:7700'
    volumes:
      - meilisearch-data:/data.ms
    environment:
      MEILI_MASTER_KEY: hachimi-world
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:7700/health']
      interval: 3s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  postgresql:
    image: postgres:17.11-alpine
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: hachimi-world
      POSTGRES_PASSWORD: dev12345678
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: [ 'CMD', 'pg_isready' ]
      interval: 3s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  # Valkey, under the service name redis so `redis.address: redis:6379` keeps working
  redis:
    image: valkey/valkey:9.1-alpine
    ports:
      - '6379:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'PING']
      interval: 3s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  postgresql-data:
  valkey-data:
  meilisearch-data: