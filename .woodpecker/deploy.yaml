when:
  branch:
    - master
  event:
    - push
    - manual
steps:
  # Build with the host Docker daemon so the layer cache (incl. cargo-chef deps) persists between deploys.
  # Prune it on the host occasionally: docker builder prune -f --filter until=168h
  - name: build-and-push
    image: docker:cli
    environment:
      REGISTRY:
        from_secret: registry_server
      REPO:
        from_secret: registry_repo
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - echo "$${REGISTRY_PASSWORD}" | docker login "$${REGISTRY}" -u "$${REGISTRY_USERNAME}" --password-stdin
      - docker build -t "$${REPO}:${CI_COMMIT_SHA}" -t "$${REPO}:latest" .
      - docker push "$${REPO}:${CI_COMMIT_SHA}"
      - docker push "$${REPO}:latest"
  - name: deploy-production
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: deploy_ssh_host
      port:
        from_secret: deploy_ssh_port
      username:
        from_secret: deploy_ssh_username
      key:
        from_secret: deploy_ssh_key
      # Pull + rollout (up to 300s healthcheck) + drain + up to 60s graceful shutdown.
      command_timeout: 10m
      script_stop: true
      script:
        - ./deploy_hachimi_world_server.sh ${CI_COMMIT_SHA}
  # Two steps instead of one message that reads build.status: under Woodpecker the plugin saw
  # success even after a failed step. Woodpecker's own `when.status` picks the right one.
  - name: notify-success
    image: appleboy/drone-discord:1.5.1
    settings:
      webhook_url:
        from_secret: discord_webhook_url
      message: |
        ✅ Succeeded: {{repo.name}} · deploy · {{commit.branch}} @ {{truncate commit.sha 7}}
        {{build.link}}
    # A Discord outage should not mark the pipeline as failed
    failure: ignore
    when:
      - status: [success]
  - name: notify-failure
    image: appleboy/drone-discord:1.5.1
    settings:
      webhook_url:
        from_secret: discord_webhook_url
      message: |
        ❌ Failed: {{repo.name}} · deploy · {{commit.branch}} @ {{truncate commit.sha 7}}
        {{build.link}}
    # A Discord outage should not mark the pipeline as failed
    failure: ignore
    when:
      - status: [failure]
