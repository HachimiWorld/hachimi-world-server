when:
  branch:
    exclude:
      - master
  event:
    - push
    - manual
steps:
  # Named volume is the cache; do not tar/zstd (write amplification).
  # Share CARGO_HOME with other workflows; keep CARGO_TARGET_DIR isolated.
  - name: build
    image: rust:1.99.1
    environment:
      SQLX_OFFLINE: true
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/target/build-check
    volumes:
      - woodpecker-hachimi-world-cache:/cache
    commands:
      - mkdir -p "$CARGO_HOME/bin" "$CARGO_TARGET_DIR"
      - cargo build --bin hachimi-world-server
  # openapi.json is generated from the routes; a change to the API must commit the new one.
  - name: openapi-current
    image: rust:1.99.1
    environment:
      SQLX_OFFLINE: true
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/target/build-check
    volumes:
      - woodpecker-hachimi-world-cache:/cache
    commands:
      - cargo run --bin gen_openapi
      - git diff --exit-code openapi.json || (echo "openapi.json is out of date, run 'cargo run --bin gen_openapi' and commit it" && exit 1)
  # Released clients talk to what's on master, so a change from master's API must not break them.
  - name: api-compat
    image: tufin/oasdiff:v1.37.0
    commands:
      - git fetch --depth=1 origin master
      - |
        if git cat-file -e FETCH_HEAD:openapi.json 2>/dev/null; then
          git show FETCH_HEAD:openapi.json > /tmp/openapi-master.json
          oasdiff breaking /tmp/openapi-master.json openapi.json --fail-on ERR --severity-levels .oasdiff-severity-levels --err-ignore .oasdiff-err-ignore
        else
          echo "master has no openapi.json yet, nothing to compare"
        fi
  # Two steps instead of one message that reads build.status: under Woodpecker the plugin saw
  # success even after a failed step. Woodpecker's own `when.status` picks the right one.
  - name: notify-success
    image: appleboy/drone-discord:1.5.1
    settings:
      webhook_url:
        from_secret: discord_webhook_url
      message: |
        ✅ Succeeded: {{repo.name}} · build-check · {{commit.branch}} @ {{truncate commit.sha 7}}
        {{build.link}}
    # A Discord outage should not mark the pipeline as failed
    failure: ignore
    when:
      - status: [success]
  - name: notify-failure
    image: appleboy/drone-discord:1.5.1
    settings:
      webhook_url:
        from_secret: discord_webhook_url
      message: |
        ❌ Failed: {{repo.name}} · build-check · {{commit.branch}} @ {{truncate commit.sha 7}}
        {{build.link}}
    # A Discord outage should not mark the pipeline as failed
    failure: ignore
    when:
      - status: [failure]
