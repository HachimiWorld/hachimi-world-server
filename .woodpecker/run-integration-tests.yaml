when:
  branch:
    exclude:
      - master
  event:
    - push
    - manual
steps:
  - name: build
    image: rust:1.96.0
    environment:
      SQLX_OFFLINE: true
    commands:
      # Install cargo-nextest, the cargo folder of rust image is /usr/local/cargo/bin
      - curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C /usr/local/cargo/bin
      # Run tests
      - cargo nextest run --tests