when:
  branch:
    exclude:
      - master
  event:
    - push
    - manual
steps:
  # Named volume is the cache; do not tar/zstd (write amplification).
  # Share CARGO_HOME with other workflows; keep CARGO_TARGET_DIR isolated.
  - name: run-tests
    image: rust:1.96.0
    environment:
      SQLX_OFFLINE: true
      RUST_BACKTRACE: 1
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/target/run-integration-tests
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - woodpecker-hachimi-world-cache:/cache
    commands:
      - mkdir -p "$CARGO_HOME/bin" "$CARGO_TARGET_DIR"
      - export PATH="$CARGO_HOME/bin:$PATH"
      - |
        if ! command -v cargo-nextest >/dev/null; then
          echo "cargo-nextest not found, downloading"
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "$CARGO_HOME/bin"
        else
          echo "cargo-nextest cached at $(command -v cargo-nextest)"
        fi
      - cargo nextest run --no-fail-fast --tests -j 4
  - name: notify
    image: appleboy/drone-discord:1.5.1
    settings:
      webhook_url:
        from_secret: discord_webhook_url
      message: |
        {{#success build.status}}Succeeded{{else}}Failed{{/success}}: {{repo.name}} · run-integration-tests · {{commit.branch}} @ {{truncate commit.sha 7}}
        {{build.link}}
    # A Discord outage should not mark the pipeline as failed
    failure: ignore
    when:
      - status: [success, failure]
